server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS resolver so upstream is resolved per-request,
    # not at startup — prevents "host not found" when backend is still starting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback: serve index.html for any unknown route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all backend API calls to the backend service
    location /api/ {
        set $upstream http://backend:8080;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Also proxy /health to the backend for external liveness checks
    location /health {
        set $upstream http://backend:8080;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
