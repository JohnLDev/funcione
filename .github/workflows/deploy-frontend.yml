name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - apps/frontend/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Cloudflare frontend
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PAGES_PROJECT_NAME: funcione-milex
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://funcione-api.onrender.com' }}
      VITE_AUTH_REDIRECT_URL: ${{ vars.VITE_AUTH_REDIRECT_URL || 'https://funcione-milex.pages.dev' }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deployment secret::$name is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck --workspace @langchain-training/frontend

      - name: Build frontend
        run: npm run build --workspace @langchain-training/frontend

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          create_output="$(npx wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT_NAME" --production-branch=main 2>&1)"
          create_status="$?"
          set -e
          echo "$create_output"
          if [ "$create_status" -eq 0 ]; then
            echo "Created Cloudflare Pages project $CLOUDFLARE_PAGES_PROJECT_NAME"
          elif echo "$create_output" | grep -Eiq "already exists|project.*exists"; then
            echo "Cloudflare Pages project $CLOUDFLARE_PAGES_PROJECT_NAME already exists"
          else
            exit "$create_status"
          fi

      - name: Deploy frontend to Cloudflare Pages
        working-directory: apps/frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch=main
